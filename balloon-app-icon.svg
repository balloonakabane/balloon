<path d="M126 180c14 0 19-5 19-20 0 15 5 20 19 20-14 0-19 5-19 20 0-15-5-20-19-20Z" fill="#FFF5FE"/>
<path d="M858 636c10 0 14-4 14-14 0 10 4 14 14 14-10 0-14 4-14 14 0-10-4-14-14-14Z" fill="#FFF5FE"/>
